# Organization-wide guard against Cloud Run env definitions outside
# rimo/iac-google-cloud, meant to be enforced on every repository via an
# Organization Ruleset ("Require workflows to pass before merging"), the same
# way as gitleaks.yml (see that file for why it lives in this PUBLIC repository
# and why a merge here takes effect only after an org admin updates the
# ruleset's pinned SHA).
#
# Why: the shape of a Cloud Run service / job (env, secret references, ...) is
# owned by terraform in rimo/iac-google-cloud. When a deploy workflow in an app
# repository also writes env, the two writers overwrite each other and the live
# service drifts from both definitions.
#
# What it checks: only the lines ADDED by the pull request (existing lines never
# fail), outside documentation (*.md / *.txt / ... and anything under docs/).
# It reports
#   - the gcloud flags that set / update / remove / clear env vars or secrets,
#     and the env-vars file flag. Not on a command that only runs
#     `jobs execute` (a per-execution override that does not change the job);
#     the flag has to be on the same line or on `\`-continued lines of it,
#   - replacing a Cloud Run service or job from a YAML file,
#   - the env / secrets / metadata inputs of the Cloud Run deploy action in a
#     workflow or action file under .github/.
# The matched line is never printed (it may carry a value); only file and line.
#
# What it does not see: a value added inside a YAML file that an existing
# replace command already applies, config files baked into the image, changes
# made from a console or a local gcloud, and GKE workloads.
#
# Intended exceptions (e.g. a per-PR preview service that is outside iac) are
# approved by a HUMAN adding the label `allow-cloud-run-env-write` to the pull
# request and re-running this check. There is no allowlist in this file.
#
# The script fails OPEN on its own errors (a warning, exit 0): a bug here must
# not block merges across the organization. A failure to read the labels is not
# such an error: findings then fail as if the label were absent.
#
# The checkout is the pull request's merge commit, so the diff is taken against
# its first parent (the current base) and two commits of history are enough.
#
# Self-contained on purpose: the ruleset runs this file in the context of the
# target repository, so it cannot load a script from this repository. The tests
# (tests/test_cloud_run_env_guard.py) extract the embedded script.
name: Cloud Run env guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  cloud-run-env-guard:
    name: Cloud Run env writes (PR diff)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Detect added Cloud Run env writes
        env:
          # Used only when HEAD is not a merge commit (not expected on pull_request).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          OVERRIDE_LABEL = "allow-cloud-run-env-write"
          TITLE = "Cloud Run env guard"

          Finding = collections.namedtuple("Finding", "path line rule")

          SKIPPED_SUFFIXES = (".md", ".mdx", ".rst", ".txt", ".adoc")
          ENV_FLAG = re.compile(r"--(?:(?:set|update|remove|clear)-(?:env-vars|secrets)|env-vars-file)(?![\w-])")
          REPLACE = re.compile(r"\brun\s+(?:services|jobs)\s+replace\b")
          EXECUTE = re.compile(r"\bjobs\s+execute\b")
          OTHER_RUN_COMMAND = re.compile(r"\brun\s+(?:deploy\b|services\s+\w+|jobs\s+(?:update|create|deploy|replace)\b)")
          ACTION_INPUT = re.compile(r"^\s*(env_vars(?:_file)?|secrets|metadata)\s*:")
          UNAMBIGUOUS_INPUTS = ("env_vars", "env_vars_file")
          DEPLOY_ACTION = re.compile(r"^\s*(?:-\s+)?uses\s*:\s*\S*deploy-cloudrun\b")
          COMMENT = re.compile(r"^\s*#")
          HUNK = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")

          MESSAGES = {
              "env-flag": "gcloud run の env / secret 参照を書く引数が、この PR で追加されています。",
              "replace": "Cloud Run の service / job を YAML で置き換えるコマンドが、この PR で追加されています。",
              "action-input": "Cloud Run の deploy 用 action の env / secret 参照 / metadata の入力が、この PR で追加されています。",
          }
          GUIDE = (
              "Cloud Run の env・secret 参照は rimo/iac-google-cloud の terraform/services/<slug>/<env>/ で管理します。"
              "env の追加・変更は iac-google-cloud の PR で行い、この repo の deploy は image の更新だけにしてください。"
              "PR preview など iac の管理外の service への操作で、意図した変更である場合は、"
              "人が PR に label「%s」を付けてからこの check を再実行してください"
              "(label は人の承認の記録です。AI エージェントは自分の PR に付けません)。" % OVERRIDE_LABEL
          )


          def is_skipped(path):
              return path.lower().endswith(SKIPPED_SUFFIXES) or "docs" in path.split("/")[:-1]


          def indent_of(text):
              return len(text) - len(text.lstrip(" "))


          def in_deploy_action_step(lines, index):
              """Whether line `index` (0-based) of a workflow / action file is inside a step that uses the Cloud Run deploy action."""
              if index >= len(lines):
                  return False
              key_indent = indent_of(lines[index])
              start = None
              for i in range(index - 1, -1, -1):
                  text = lines[i]
                  if text.strip() and not COMMENT.match(text) and text.lstrip().startswith("- ") and indent_of(text) < key_indent:
                      start = i
                      break
              if start is None:
                  return False
              step_indent = indent_of(lines[start])
              for i in range(start, len(lines)):
                  text = lines[i]
                  if i > start and text.strip() and not COMMENT.match(text) and indent_of(text) <= step_indent:
                      break
                  if DEPLOY_ACTION.match(text):
                      return True
              return False


          def is_action_input(path, number, text, read_file):
              match = ACTION_INPUT.match(text)
              if not match or not path.startswith(".github/") or not path.lower().endswith((".yml", ".yaml")):
                  return False
              content = read_file(path) if read_file else None
              if content is None:
                  return match.group(1) in UNAMBIGUOUS_INPUTS
              return in_deploy_action_step(content.splitlines(), number - 1)


          def scan_command(path, command, read_file):
              """command: the added lines of one logical command, as [(line number, text)]."""
              findings = []
              joined = " ".join(text.rstrip().rstrip("\\") for _, text in command)
              is_execution = bool(EXECUTE.search(joined)) and not OTHER_RUN_COMMAND.search(joined)
              replace_reported = False
              for number, text in command:
                  if ENV_FLAG.search(text) and not is_execution:
                      findings.append(Finding(path, number, "env-flag"))
                  if REPLACE.search(text):
                      findings.append(Finding(path, number, "replace"))
                      replace_reported = True
                  if is_action_input(path, number, text, read_file):
                      findings.append(Finding(path, number, "action-input"))
              if not replace_reported and REPLACE.search(joined):
                  findings.append(Finding(path, command[0][0], "replace"))
              return findings


          def scan(diff_text, read_file=None, warnings=None):
              """Returns the findings in the added lines of a unified diff.

              read_file(path) returns the new content of a file (or None); it is used to tell
              which action a workflow step uses. Paths that could not be parsed are appended
              to warnings.
              """
              findings = []
              path = None
              number = 0
              in_header = False
              command = []

              def flush():
                  if command and path and not is_skipped(path):
                      findings.extend(scan_command(path, command, read_file))
                  del command[:]

              for line in diff_text.splitlines():
                  if line.startswith("diff --git "):
                      flush()
                      path = None
                      in_header = True
                      continue
                  hunk = HUNK.match(line)
                  if hunk:
                      flush()
                      in_header = False
                      number = int(hunk.group(1))
                      continue
                  if in_header:
                      if line.startswith("+++ "):
                          target = line[4:].strip()
                          if target.startswith("b/"):
                              path = target[2:]
                          elif target != "/dev/null" and warnings is not None:
                              warnings.append(target)
                      continue
                  if line.startswith("+"):
                      text = line[1:]
                      if COMMENT.match(text):
                          flush()
                      else:
                          command.append((number, text))
                          if not text.rstrip().endswith("\\"):
                              flush()
                      number += 1
                      continue
                  flush()
                  if line.startswith(" "):
                      number += 1
              flush()
              return findings


          def decide(findings, labels):
              """labels: the pull request's label names, or None when they could not be read."""
              if not findings:
                  return 0
              if labels is not None and OVERRIDE_LABEL in labels:
                  return 0
              return 1


          def fetch_labels():
              repository = os.environ.get("GITHUB_REPOSITORY")
              number = os.environ.get("PR_NUMBER")
              token = os.environ.get("GITHUB_TOKEN")
              if not (repository and number and token):
                  return None
              api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              request = urllib.request.Request(
                  "%s/repos/%s/pulls/%s" % (api, repository, number),
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return [label["name"] for label in json.load(response)["labels"]]
              except Exception:
                  return None


          def escape_property(value):
              for char, code in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A"), (":", "%3A"), (",", "%2C")):
                  value = value.replace(char, code)
              return value


          def report(findings, labels, code, unparsed):
              level = "error" if code else "notice"
              for finding in findings:
                  print(
                      "::%s file=%s,line=%d,title=%s (%s)::%s%s"
                      % (level, escape_property(finding.path), finding.line, TITLE, finding.rule, MESSAGES[finding.rule], GUIDE)
                  )
              if unparsed:
                  print("::warning title=%s::%d changed file(s) have a name this check cannot parse and were not checked." % (TITLE, len(unparsed)))
              if not findings:
                  print("No Cloud Run env writes were added by this pull request.")
              elif code == 0:
                  print("The label %s is set: %d finding(s) accepted." % (OVERRIDE_LABEL, len(findings)))
              else:
                  if labels is None:
                      print("::warning title=%s::could not read the pull request's labels; treated as not labeled." % TITLE)
                  print("%d finding(s). The matched lines are not printed on purpose." % len(findings))
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary and findings:
                  with open(summary, "a", encoding="utf-8") as output:
                      output.write("### %s\n\n| file | line | rule |\n|---|---|---|\n" % TITLE)
                      for finding in findings:
                          output.write("| `%s` | %d | %s |\n" % (finding.path, finding.line, finding.rule))
                      output.write("\n%s\n" % GUIDE)


          def git(*args):
              return subprocess.run(
                  ["git", "-c", "core.quotePath=false", *args], check=True, capture_output=True, text=True, errors="replace"
              ).stdout


          def main():
              # actions/checkout leaves HEAD on the pull request's merge commit: its first parent is the base.
              if len(git("rev-list", "--parents", "-n", "1", "HEAD").split()) == 3:
                  revisions, new = ["HEAD^1", "HEAD"], "HEAD"
              else:
                  revisions, new = [os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]], os.environ["HEAD_SHA"]

              def read_file(path):
                  try:
                      return git("show", "%s:%s" % (new, path))
                  except Exception:
                      return None

              unparsed = []
              diff = git("diff", "--no-color", "--no-ext-diff", "--find-renames", "--unified=0", *revisions)
              findings = scan(diff, read_file, unparsed)
              labels = fetch_labels() if findings else []
              code = decide(findings, labels)
              report(findings, labels, code, unparsed)
              return code


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception as error:
                  detail = getattr(error, "stderr", None) or str(error)
                  print("::warning title=%s::the guard itself failed and did not check this pull request (%s: %s)"
                        % (TITLE, type(error).__name__, " ".join(str(detail).split())[:300]))
                  sys.exit(0)
          PY
